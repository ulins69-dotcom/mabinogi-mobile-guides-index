            "暴風雨的最中間，我看見了。",
            "天上。",
            "在最黑最黑的那一片雲裡，有一個影子。",
            "很大。很長。翅膀張開，比我們的船還大。",
            "牠在雲裡飛，飛得很慢，很穩，好像暴風雨對牠來說，只是一陣微風。",
            "牠的鱗，是藍色的。",
            "不是石頭的灰。是藍色。很深很深的藍，像最深的海底。",
            "閃電打下來。",
            "那一瞬間，我看見了牠的眼睛。",
            "金色的。",
            "很老很老的金色。",
            "牠在看我。",
            "---",
            "然後，牠不見了。",
            "雲合起來。暴風雨還在。浪還在砸。",
            "可是我知道。",
            "我看見了。",
            "「娜歐！」我大喊，「妳看到了嗎？」",
            "娜歐抓著我的手臂，全身濕透，頭髮黏在臉上。",
            "她點頭。",
            "「牠在看你。」她說。",
            "「為什麼？」",
            "娜歐沒有回答。",
            "她只是抓著我的手，抓得很緊。",
            "---",
            "暴風雨在天亮以前停了。",
            "海很平。平得像一面鏡子。太陽從我們身後升起來，把整片海照成金色。",

            "很長，很細，從海的左邊，一直延伸到右邊。",
            "陸地。",
            "「伊利亞。」特拉克說。他的臉還很白，可是他的眼睛很亮。",
            "船越來越近。",
            "那條線，慢慢地，變成了顏色。",
            "金色的沙。白色的雪。綠色的森林。紅色的，冒著煙的山。",
            "全部擠在同一條海岸線上，像有人把四個季節，同時打翻在一塊土地上。",
            "「……好大。」娜歐說。",
            "---",
            "露亞站在船頭。雨衣的帽子拿下來了。她閉著眼睛，聽了很久。",
            "「女神說，」她小聲說，「這裡，她聽不太清楚。」",
            "「為什麼？」",
            "露亞皺起眉頭。",
            "「因為這裡，」她說，「還有另一個神的味道。」",
            "「另一個神？」",
            "露亞搖搖頭。",
            "「很舊很舊的。」她說，「在睡覺。可是，睡得不太好。」",
            "---",
            "船靠岸的時候，港口很熱鬧。",
            "不是庫漢那種熱鬧。是另一種。",
            "人類，穿著厚厚的探險裝，背著很大很大的背包，在碼頭上大聲講話。",

            "還有巨人。",
            "我第一次看見巨人。",
            "很大。比灰色的大個子還大。他們穿著很厚的毛皮，臉上有鬍子，說話的聲音像打雷。一個巨人從我們旁邊走過去，每一步，碼頭的木板就往下沉一下。",
            "他看了精靈一眼。",
            "精靈看了他一眼。",
            "碼頭上，突然安靜了一瞬間。",
            "然後，兩個人，同時轉開頭，走向相反的方向。",
            "「……他們感情不好？」我小聲問。",
            "特拉克看著他們的背影。",
            "「很不好。」他說，「書上說，打了很多很多年。」",
            "「為什麼？」",
            "特拉克想了一下。",
            "「書上說，」他說，「沒有人記得為什麼了。」",
            "---",
            "我們走下船。",
            "我的腳，踩在伊利亞的土地上。",
            "很燙。沙子，被太陽曬了一整個早上，燙得像剛出爐的麵包。",
            "「燙燙燙燙燙——」特拉克跳了起來。",
            "「你為什麼沒穿鞋？」",
            "「暴風雨的時候，」特拉克單腳跳著，「被浪捲走了。」",
            "「跟斗篷一起？」",
            "「……跟斗篷一起。」",
            "普萊斯從我們身邊走過去，鞋子好好的，帽子好好的。",
            "他看了特拉克一眼。",
            "然後，他從背包裡，拿出一雙鞋。",
            "「新大陸限定。」他說。",
            "「多少？」",
            "「一千金幣。」",
            "「……成交。」",
            "---",

            "然後，一個很老的探險家，喝了一口酒，壓低聲音。",
            "「你們知道嗎，」他說，「前幾天，有人在火山那邊，看到了龍。」",
            "營火旁邊，安靜了。",
            "「藍色的。」老探險家說，「很大。停在火山口的一塊石頭上。」",
            "他又喝了一口酒。",
            "「牠的背上，」他說，「坐著一個人。」",
            "我的心，跳了一下。",
            "「什麼樣的人？」",
            "老探險家看著我。",
            "「看不清楚。」他說，「太遠了。只看得到，那個人的頭髮。」",
            "他停了一下。",
            "「紅色的。」"

      "text": "通往杜巴頓的松林道。有樵夫，也有會聞麵包的棕熊。"
    },
    {
      "id": "dunbarton",
      "name": "杜巴頓",
      "first": "ch-11",
      "text": "很吵的城。教堂在東邊，夕陽從彩色玻璃切進來。"
    },
    {
      "id": "colhen",
      "name": "庫漢",
      "first": "ch-17",
      "text": "聲音是鹹的。海鷗、造船所、碼頭旁畫著鬆餅的旅館。"
    },
    {
      "id": "otherworld",
      "name": "另一個世界",
      "first": "ch-08",
      "text": "沒有顏色，沒有風，也沒有水聲。三個人以為那裡是樂園。"
    },
    {
      "id": "soulstream",
      "name": "靈魂之流",
      "first": null,
      "text": ""
    },
    {
      "id": "gairech",
      "name": "萊爾特丘陵",
      "first": "ch-19",
      "text": "杜巴頓北方。風從四面八方來，長草像海浪。"
    },
    {
      "id": "moongate",
      "name": "月之門",
      "first": "ch-20",
      "text": "丘陵上的古老傳送門。穿過去像被一口鐘罩住，有人在外面敲了一下。"
    },
    {
      "id": "dragonruin",
      "name": "龍的遺跡",
      "first": "ch-20",
      "text": "一圈比房子還高的石頭，刻著像鱗的紋路。風吹過時像龍在打呼。"
    },
    {
      "id": "bangor",
      "name": "班克爾",
      "first": "ch-20",
      "text": "丘陵北方的礦村，有一座很大的水車。"
    },
    {
      "id": "cloudwild",
      "name": "雲海曠野",
      "first": "ch-22",
      "text": "班克爾北方。夜裡低雲貼地流動，像一片淹到膝蓋的銀色的海。"
    },
    {
      "id": "bari",
      "name": "巴里礦區",
      "first": "ch-23",
      "text": "班克爾北方的礦坑。第二坑道最深處，有一扇被關起來的門。"
    },
    {
      "id": "emain",
      "name": "艾明馬夏",
      "first": "ch-26",
      "text": "湖對岸的白色城市。很漂亮。漂亮的東西，底下通常都藏著什麼。"
    },
    {
      "id": "senmag",
      "name": "山米爾平原",
      "first": "ch-28",
      "text": "艾明馬夏附近的平原。邊上有長滿雜草的古墳，骷髏會從裡面爬出來。"
    },
    {
      "id": "rift",
      "name": "縫隙",
      "first": "ch-40",
      "text": "艾菲祭壇上一道很細的黑縫。裡面是碎掉的灰色世界，一座一座浮在虛空裡的島。"
    },
    {
      "id": "palemountain",
      "name": "蒼白之山",
      "first": "ch-42",
      "text": "整座山的顏色都被洗掉了。山腰有一座很舊的城，失去顏色的人一步一步往那裡走。"
    },
    {
      "id": "rundal",
      "name": "倫達",
      "first": "ch-46",
      "text": "艾明馬夏西邊地底下的古代水道。水聲在拱頂下像一整座城市在低聲說話。"
    },
    {
      "id": "fiodh",
      "name": "菲歐德",
      "first": "ch-48",
      "text": "女神很久以前住過的森林。綠得很用力。最大的樹下有一塊劍形凹痕的石床，樹根旁刻著「三勇士，到此一遊」。"
    },
    {
      "id": "canyon",
      "name": "魔族的峽谷",
      "first": "ch-54",
      "text": "一條正在流血般的紅色峽谷。鼓聲、營火、磨刀聲。最深處的洞裡，盤著一條刻滿宰相字跡的石龍。"
    },
    {
      "id": "iria",
      "name": "伊利亞",
      "first": "ch-60",
      "text": "海的另一邊的新大陸。沙漠、雪原、森林、火山擠在同一條海岸線上。精靈和巨人打了很多年，沒有人記得為什麼。"
    }
  ],
  "map": {
    "image": "",
    "note": "地圖會隨故事逐步展開。"
  }
}
</script>

<script>
(function () {
  "use strict";

  // ---------- safe DOM helper (never uses innerHTML: external text is hostile) ----------
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else el.setAttribute(k, v === true ? "" : String(v));
      });
    }
    (kids || []).forEach(function (kid) {
      if (kid === null || kid === undefined) return;
      el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    });
    return el;
  }
  function str(v, d) { return typeof v === "string" ? v : (d === undefined ? "" : d); }
  function arr(v) { return Array.isArray(v) ? v : []; }

  // ---------- storage (optional, per-viewer convenience only) ----------
  function store(get, key, val) {
    try {
      if (get) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, val);
    } catch (e) { /* storage unavailable: page still works */ }
    return null;
  }

  // ---------- data ----------
  var app = document.getElementById("app");
  var DATA = null;
  try {
    DATA = JSON.parse(document.getElementById("novel-data").textContent);
  } catch (e) {
    app.replaceChildren(h("p", { class: "state", text: "資料載入失敗：請重新整理頁面。若持續發生，請回報站主。" }));
    return;
  }
  var meta = DATA.meta || {};
  var readable = []; // every chapter-like item, in reading order
  arr(DATA.samples).forEach(function (s) { readable.push({ item: s, group: "samples" }); });
  arr(DATA.volumes).forEach(function (v) {
    arr(v.chapters).forEach(function (c) { readable.push({ item: c, group: "v:" + str(v.id) }); });
  });
  function published(id) {
    for (var i = 0; i < readable.length; i++) {
      var it = readable[i].item;
      if (it.id === id) return it.status === "published";
    }
    return false;
  }
  function unlocked(first) { return !!first && published(first); }
  function findItem(id) {
    for (var i = 0; i < readable.length; i++) if (readable[i].item.id === id) return readable[i];
    return null;
  }

  // ---------- image slot: only accepts embedded data URIs ----------
  function imageOrPlaceholder(src, glyph, cls) {
    var box = h("div", { class: cls });
    if (typeof src === "string" && /^data:image\/(png|jpeg|webp|gif|svg\+xml);/.test(src)) {
      box.appendChild(h("img", { src: src, alt: "", loading: "lazy" }));
    } else {
      box.textContent = glyph;
    }
    return box;
  }

  // ---------- views ----------
  function tocItem(entry, latestId) {
    var it = entry.item;
    var isPub = it.status === "published";
    var li = h("li", { class: (isPub ? "on " : "") + (it.id === latestId ? "latest" : "") });
    var titleLine = [h("span", { class: "t", text: (str(it.label) ? str(it.label) + "　" : "") + str(it.title, "（未命名）") })];
    if (it.draft) titleLine.push(h("span", { class: "badge", text: "示範稿" }));
    if (it.kind === "side") titleLine.push(h("span", { class: "badge", text: "外傳" }));
    var inner = [h("span", null, titleLine), h("span", { class: "s", text: isPub ? str(it.teaser) : (str(it.teaser) ? str(it.teaser) + "（籌備中）" : "籌備中") })];
    li.appendChild(isPub ? h("a", { href: "#/c/" + encodeURIComponent(it.id) }, inner) : h("div", { class: "off" }, inner));
    return li;
  }

  function viewHome() {
    var frag = document.createDocumentFragment();
    var latest = null, first = null;
    readable.forEach(function (r) { if (r.item.status === "published") { latest = r.item.id; if (!first) first = r.item.id; } });

    var side = h("div", { class: "cover-side" }, [
      h("p", { class: "kicker", text: str(meta.subtitle) }),
      h("p", { class: "epigraph", text: str(meta.epigraph) }),
      h("p", { class: "blurb", text: str(meta.blurb) }),
      heroName
        ? h("p", { class: "namecard" }, ["主角：", h("strong", { text: nameNow() }), h("a", { href: "#/name", text: "改名" })])
        : h("p", { class: "namecard" }, ["開始之前，替主角取個名字吧。沒取的話，他會叫「", h("strong", { text: DEFAULT_NAME }), "」。", h("a", { href: "#/name", text: "取名" })]),
      first ? h("a", { class: "btn", href: "#/c/" + encodeURIComponent(first), text: "開始閱讀" }) : null
    ]);
    frag.appendChild(h("section", { class: "cover" }, [side, h("h1", { class: "title-v", text: str(meta.title, "愛爾琳史詩") })]));

    var samples = readable.filter(function (r) { return r.group === "samples"; });
    if (samples.length) {
      frag.appendChild(h("h2", { class: "section-h", text: "示範稿" }));
      frag.appendChild(h("p", { class: "section-note", text: "先確認語氣與節奏，不屬於正文編號。" }));
      frag.appendChild(h("ol", { class: "river" }, samples.map(function (r) { return tocItem(r, latest); })));
    }
    arr(DATA.volumes).forEach(function (v) {
      frag.appendChild(h("h2", { class: "section-h", text: str(v.title, "（未命名卷）") }));
      var list = readable.filter(function (r) { return r.group === "v:" + str(v.id); });
      if (!list.length) frag.appendChild(h("p", { class: "state", text: "這一卷還沒有章節。" }));
      else frag.appendChild(h("ol", { class: "river" }, list.map(function (r) { return tocItem(r, latest); })));
    });
    return { title: str(meta.title) + "｜" + str(meta.subtitle), node: frag };
  }

  function renderBlock(b) {
    if (b === "---") return h("hr");
    if (typeof b === "string") return h("p", { text: nm(b) });
    if (Array.isArray(b)) {
      return h("p", null, b.map(function (seg) {
        if (typeof seg === "string") return nm(seg);
        if (seg && typeof seg.b === "string") return h("b", { text: nm(seg.b) });
        return null;
      }));
    }
    return null;
  }

  var DEFAULT_NAME = str(meta.defaultName, "諾瓦");
  function cleanName(v) {
    if (typeof v !== "string") return "";
    v = v.replace(/[\u0000-\u001f{}<>]/g, "").trim();
    return Array.from(v).slice(0, 8).join("");
  }
  var heroName = cleanName(store(true, "erinn-name") || "");
  function nameNow() { return heroName || DEFAULT_NAME; }
  function nm(t) { return typeof t === "string" ? t.split("{名}").join(nameNow()) : t; }

  var scale = parseFloat(store(true, "erinn-fs")) || 1.06;
  function applyScale() { document.documentElement.style.setProperty("--fs", scale + "rem"); }
  function bump(d) {
    scale = Math.min(1.5, Math.max(0.9, Math.round((scale + d) * 100) / 100));
    applyScale();
    store(false, "erinn-fs", String(scale));
  }

  function viewChapter(id) {
    var found = findItem(id);
    if (!found) return { title: "找不到這一章", node: h("div", { class: "state" }, [h("p", { text: "找不到這一章，網址可能有誤。" }), h("a", { href: "#/", text: "回到目錄" })]) };
    var it = found.item;
    if (it.status !== "published") {
      return { title: str(it.title), node: h("div", { class: "state" }, [h("p", { text: "這一章還在寫，完成後會出現在目錄。" }), h("a", { href: "#/", text: "回到目錄" })]) };
    }
    var head = h("header", { class: "chapter-head" }, [
      h("h1", { text: (str(it.label) ? str(it.label) + "　" : "") + str(it.title, "（未命名）") }),
      h("div", { class: "tools" }, [
        h("span", { text: "字級" }),
        h("button", { type: "button", id: "fs-down", "aria-label": "縮小字級", text: "A−" }),
        h("button", { type: "button", id: "fs-up", "aria-label": "放大字級", text: "A＋" }),
        h("a", { href: "#/name", text: "主角：" + nameNow() + "（改名）" })
      ])
    ]);
    var prose = h("article", { class: "prose" }, arr(it.blocks).map(renderBlock));
    var pubs = readable.filter(function (r) { return r.item.status === "published" && (r.group === "samples") === (found.group === "samples"); });
    var idx = pubs.indexOf(found);
    var prev = idx > 0 ? pubs[idx - 1].item : null;
    var next = idx >= 0 && idx < pubs.length - 1 ? pubs[idx + 1].item : null;
    var pager = h("nav", { class: "pager", "aria-label": "章節切換" }, [
      prev ? h("a", { href: "#/c/" + encodeURIComponent(prev.id), text: "上一章" }) : h("span"),
      h("a", { href: "#/", text: "目錄" }),
      next ? h("a", { href: "#/c/" + encodeURIComponent(next.id), text: "下一章" }) : h("span")
    ]);
    var frag = document.createDocumentFragment();
    frag.appendChild(head);
    if (it.draft) frag.appendChild(h("p", { class: "draft-note", text: "示範稿：用來確認語氣，之後可能大幅修改。" }));
    if (it.kind === "side") frag.appendChild(h("p", { class: "draft-note", text: "外傳：主線之外的故事，補上主線沒說完的事。跳過也不影響閱讀。" }));
    frag.appendChild(prose);
    frag.appendChild(pager);
    store(false, "erinn-last", id);
    return { title: str(it.title) + "｜" + str(meta.title), node: frag, reading: true };
  }

  function viewCast() {
    var cards = arr(DATA.cast).map(function (c) {
      var open = unlocked(c.first);
      return h("article", { class: "card" + (open ? "" : " locked") }, [
        imageOrPlaceholder(open ? c.image : "", "？", "portrait"),
        h("div", { class: "body" }, open ? [
          h("h3", { text: nm(str(c.name, "（未命名）")) }),
          str(c.role) ? h("p", { class: "role", text: str(c.role) }) : null,
          str(c.bio) ? h("p", { text: str(c.bio) }) : null
        ] : [h("h3", { text: "？？？" }), h("p", { class: "role", text: "尚未登場" })])
      ]);
    });
    var n = arr(DATA.cast).filter(function (c) { return unlocked(c.first); }).length;
    return { title: "人物｜" + str(meta.title), node: h("div", null, [
      h("h1", { class: "page-h", text: "人物" }),
      h("p", { class: "lead", text: "已登場 " + n + " ／ " + arr(DATA.cast).length + "。隨章節更新解鎖。" }),
      h("div", { class: "grid" }, cards)
    ]) };
  }

  function viewWorld() {
    var items = arr(DATA.world).map(function (w) {
      var open = unlocked(w.first);
      return h("li", null, open ? [h("h3", { text: str(w.name, "（未命名）" ) }), h("p", { text: str(w.text) })] : [h("h3", { text: "？？？" }), h("p", { text: "隨故事解鎖" })]);
    });
    return { title: "世界｜" + str(meta.title), node: h("div", null, [
      h("h1", { class: "page-h", text: "世界" }),
      h("p", { class: "lead", text: "地名與設定，讀到才會出現。" }),
      h("ul", { class: "entries" }, items)
    ]) };
  }

  function viewMap() {
    var m = DATA.map || {};
    var box = h("div", { class: "mapbox" });
    if (typeof m.image === "string" && /^data:image\/(png|jpeg|webp|svg\+xml);/.test(m.image)) box.appendChild(h("img", { src: m.image, alt: "愛爾琳地圖" }));
    else box.textContent = "地圖圖像待放入";
    var places = arr(DATA.world).filter(function (w) { return unlocked(w.first); }).map(function (w) { return h("li", { text: str(w.name) }); });
    return { title: "地圖｜" + str(meta.title), node: h("div", null, [
      h("h1", { class: "page-h", text: "地圖" }),
      h("p", { class: "lead", text: str(m.note) }),
      box,
      h("h2", { class: "section-h", text: "已出現的地點" }),
      places.length ? h("ul", { class: "entries" }, places) : h("p", { class: "state", text: "還沒有地點。" })
    ]) };
  }

  function viewName() {
    var input = h("input", { id: "name-in", type: "text", maxlength: "8", value: heroName, placeholder: DEFAULT_NAME, autocomplete: "off", "aria-describedby": "name-help" });
    var msg = h("p", { class: "msg", role: "status" });
    var save = h("button", { type: "button", class: "primary", text: "儲存名字" });
    var reset = h("button", { type: "button", class: "ghost", text: "用預設名字（" + DEFAULT_NAME + "）" });
    function done(text) {
      msg.textContent = text;
      var last = store(true, "erinn-last");
      window.setTimeout(function () { location.hash = last ? "#/c/" + encodeURIComponent(last) : "#/"; }, 700);
    }
    save.addEventListener("click", function () {
      heroName = cleanName(input.value);
      store(false, "erinn-name", heroName);
      done(heroName ? "好，從現在起，你叫「" + heroName + "」。" : "沒有輸入，先叫你「" + DEFAULT_NAME + "」。");
    });
    reset.addEventListener("click", function () {
      heroName = "";
      store(false, "erinn-name", "");
      done("已改回預設名字「" + DEFAULT_NAME + "」。");
    });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") save.click(); });
    window.setTimeout(function () { try { input.focus(); } catch (e) {} }, 0);
    return { title: "主角的名字｜" + str(meta.title), node: h("div", { class: "namebox" }, [
      h("h1", { class: "page-h", text: "主角的名字" }),
      h("p", { class: "lead", id: "name-help", text: "故事裡的人會用這個名字叫你。最多 8 個字，只存在你自己的瀏覽器裡。" }),
      h("label", { for: "name-in", text: "名字" }),
      input,
      h("div", { class: "row" }, [save, reset]),
      msg
    ]) };
  }

  function viewAbout() {
    return { title: "關於｜" + str(meta.title), node: h("div", null, [
      h("h1", { class: "page-h", text: "關於本站" }),
      h("p", { text: "這是一部以第一人稱重寫瑪奇主線的同人小說，依故事張力編排，不照遊戲章節順序。" }),
      h("p", { text: "章節、人物、地點會隨更新逐步解鎖，以減少劇透。目前版本：" + str(meta.version) + "。" }),
      h("p", { text: str(meta.disclaimer) })
    ]) };
  }

  // ---------- router ----------
  var NAV = [["#/", "目錄"], ["#/cast", "人物"], ["#/world", "世界"], ["#/map", "地圖"], ["#/about", "關於"]];
  var reading = false;
  function route() {
    var hash = location.hash || "#/";
    var view;
    if (hash.indexOf("#/c/") === 0) {
      var id = "";
      try { id = decodeURIComponent(hash.slice(4)); } catch (e) { id = ""; }
      view = viewChapter(id);
    } else if (hash === "#/cast") view = viewCast();
    else if (hash === "#/world") view = viewWorld();
    else if (hash === "#/map") view = viewMap();
    else if (hash === "#/about") view = viewAbout();
    else if (hash === "#/name") view = viewName();
    else view = viewHome();
    app.replaceChildren(view.node);
    document.title = view.title;
    reading = !!view.reading;
    document.getElementById("progress").style.width = "0";
    var links = document.querySelectorAll("#nav a");
    for (var i = 0; i < links.length; i++) {
      var on = links[i].getAttribute("href") === (hash.indexOf("#/c/") === 0 ? "#/" : hash);
      if (on) links[i].setAttribute("aria-current", "page"); else links.item(i).removeAttribute("aria-current");
    }
    var up = document.getElementById("fs-up"), down = document.getElementById("fs-down");
    if (up) up.addEventListener("click", function () { bump(0.08); });
    if (down) down.addEventListener("click", function () { bump(-0.08); });
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }

  // ---------- chrome ----------
  var nav = document.getElementById("nav");
  NAV.forEach(function (n) { nav.appendChild(h("a", { href: n[0], text: n[1] })); });
  var foot = document.getElementById("foot");
  foot.appendChild(h("p", { text: str(meta.disclaimer) }));
  if (typeof meta.guideSiteUrl === "string" && /^https:\/\//.test(meta.guideSiteUrl)) {
    foot.appendChild(h("p", null, [h("a", { href: meta.guideSiteUrl, rel: "noopener", text: "回到瑪奇攻略查詢網" })]));
  }
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var isDark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var nextTheme = isDark ? "light" : "dark";
    root.setAttribute("data-theme", nextTheme);
    store(false, "erinn-theme", nextTheme);
  });
  var savedTheme = store(true, "erinn-theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
  applyScale();

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!reading || ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      var doc = document.documentElement;
      var max = doc.scrollHeight - window.innerHeight;
      document.getElementById("progress").style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + "%";
      ticking = false;
    });
  }, { passive: true });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
<script>
/*
 * 中文朗讀（2026-10-01 加入）：用瀏覽器內建的語音合成，免費、不經過任何伺服器。
 * 只觀察 #app 換頁、在章節頁加上朗讀列，不改上面的小說資料與閱讀程式。
 */
(function () {
  "use strict";

  // 小說原稿（claude.ai artifact）現在也內建同一套朗讀；已經裝過就不要再裝第二次
  if (window.__erinnTTS) return;
  window.__erinnTTS = true;

  var app = document.getElementById("app");
  if (!app) return;
  var synth = window.speechSynthesis;
  var supported = !!(synth && window.SpeechSynthesisUtterance);
  var MAX_CHUNK = 60; // 每次唸的字數上限：Chrome 的部分語音單句太長會中途斷掉

  var KEY = { rate: "erinn-tts-rate", voice: "erinn-tts-voice", auto: "erinn-tts-autonext" };
  function load(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 只是記住偏好，失敗也沒關係 */ } }

  var settings = {
    rate: parseFloat(load(KEY.rate)) || 1,
    voice: load(KEY.voice) || "",
    auto: load(KEY.auto) === "1"
  };
  // status: idle（沒在唸）／playing／paused
  var state = { status: "idle", chunks: [], idx: 0, gen: 0, paras: [], route: "", pendingAuto: false };
  var ui = { bar: null, play: null, stop: null, voiceSel: null, status: null, mini: null, miniPlay: null, miniText: null };

  // 跟原稿同一套「不用 innerHTML」的建元素方式
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : String(v));
    });
    (kids || []).forEach(function (kid) {
      if (kid) el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    });
    return el;
  }

  // ---------- 樣式（沿用原稿的顏色變數，亮暗色自動跟著變） ----------
  var style = document.createElement("style");
  style.textContent = [
    ".tts-bar{font-family:var(--sans);display:flex;flex-wrap:wrap;gap:.45rem .7rem;align-items:center;margin:.9rem 0 0;padding:.65rem .75rem;background:var(--paper-2);border-radius:4px;font-size:.85rem;color:var(--ink-2)}",
    ".tts-bar button{font:inherit;background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:.35rem .85rem;cursor:pointer}",
    ".tts-bar button.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}",
    ".tts-bar button[disabled]{opacity:.45;cursor:default}",
    ".tts-bar select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:.2rem .3rem;max-width:13rem}",
    ".tts-bar label{display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}",
    ".tts-bar .tts-status{color:var(--river);min-width:5.5em}",
    ".tts-hint{flex-basis:100%;margin:0;font-size:.75rem;line-height:1.6;color:var(--ink-2)}",
    ".prose p.tts-on{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--lantern);padding:0 .45rem;margin-left:-.45rem;margin-right:-.45rem;border-radius:2px}",
    ".tts-reading .prose p{cursor:pointer}",
    ".tts-mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);z-index:20;display:flex;gap:.45rem;align-items:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:.35rem .4rem .35rem .95rem;font-family:var(--sans);font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100vw - 2rem)}",
    ".tts-mini[hidden]{display:none}",
    ".tts-mini button{font:inherit;background:none;color:var(--paper);border:1px solid currentColor;border-radius:999px;padding:.2rem .7rem;cursor:pointer}"
  ].join("\n");
  document.head.appendChild(style);

  // ---------- 語音 ----------
  function langOf(v) { return String(v.lang || "").replace("_", "-").toLowerCase(); }
  function zhVoices() {
    if (!supported) return [];
    return synth.getVoices().filter(function (v) { return /^(zh|cmn|yue)/.test(langOf(v)); });
  }
  // 台灣中文優先、「自然／線上」語音（較像真人）優先
  function rank(v) {
    var l = langOf(v), s = /tw|hant/.test(l) ? 4 : (/hk|yue/.test(l) ? 2 : 1);
    if (/natural|online|neural/i.test(v.name)) s += 3;
    return s;
  }
  function sortedVoices() { return zhVoices().sort(function (a, b) { return rank(b) - rank(a); }); }
  function pickVoice() {
    var list = sortedVoices();
    if (settings.voice) {
      for (var i = 0; i < list.length; i++) if (list[i].name === settings.voice) return list[i];
    }
    return list[0] || null;
  }

  // ---------- 把章節切成要唸的小段 ----------
  function speakable(t) {
    return t.replace(/[—─]+/g, "，").replace(/\s+/g, " ").trim(); // 「咚——」的破折號唸成停頓
  }
  function splitText(text) {
    var sentences = text.match(/[^。！？!?；;]+[。！？!?；;]*[」』）)]*/g) || [text];
    var out = [], buf = "";
    sentences.forEach(function (s) {
      s = s.trim();
      while (s.length > MAX_CHUNK) { // 太長的句子在逗號處再切
        var cut = s.lastIndexOf("，", MAX_CHUNK);
        if (cut < MAX_CHUNK * 0.4) cut = MAX_CHUNK - 1;
        if (buf) { out.push(buf); buf = ""; }
        out.push(s.slice(0, cut + 1));
        s = s.slice(cut + 1).trim();
      }
      if (!s) return;
      if ((buf + s).length <= MAX_CHUNK) buf += s; // 短句合併，唸起來比較順
      else { if (buf) out.push(buf); buf = s; }
    });
    if (buf) out.push(buf);
    return out.filter(function (c) { return /[㐀-鿿\w]/.test(c); });
  }
  function buildChunks(head, prose) {
    state.paras = Array.prototype.slice.call(prose.querySelectorAll("p"));
    var chunks = [];
    var title = head.querySelector("h1");
    if (title) chunks.push({ p: -1, text: speakable(title.textContent) }); // 先唸章名
    state.paras.forEach(function (p, i) {
      splitText(speakable(p.textContent)).forEach(function (t) { chunks.push({ p: i, text: t }); });
    });
    state.chunks = chunks;
  }

  // ---------- 播放控制 ----------
  function highlight(pi) {
    state.paras.forEach(function (p, i) { p.classList.toggle("tts-on", i === pi); });
    var el = state.paras[pi];
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > window.innerHeight - 80) {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    }
  }
  function speakNext() {
    var g = state.gen;
    if (state.idx >= state.chunks.length) { finish(); return; }
    var c = state.chunks[state.idx];
    highlight(c.p);
    var u = new SpeechSynthesisUtterance(c.text);
    u.lang = "zh-TW";
    var v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = settings.rate;
    u.onend = function () {
      if (g !== state.gen || state.status !== "playing") return; // 已經暫停／停止／換段，舊的結束事件不理
      state.idx++;
      speakNext();
    };
    u.onerror = function (e) {
      if (g !== state.gen || e.error === "interrupted" || e.error === "canceled") return;
      state.idx++; // 這一小段唸不出來就跳下一段，不卡住
      speakNext();
    };
    synth.speak(u);
    render();
  }
  function play(from) {
    if (!supported) return;
    var head = app.querySelector(".chapter-head"), prose = app.querySelector(".prose");
    if (!head || !prose) return;
    if (!state.chunks.length) buildChunks(head, prose);
    if (typeof from === "number") state.idx = from;
    if (state.idx >= state.chunks.length) state.idx = 0;
    state.gen++;
    synth.cancel();
    state.status = "playing";
    app.classList.add("tts-reading");
    speakNext();
  }
  function pause() {
    state.gen++;
    synth.cancel(); // 用「取消後從同一小段重唸」代替 pause()／resume()，各家瀏覽器行為比較一致
    state.status = "paused";
    render();
  }
  function stop(message) {
    state.gen++;
    if (supported) synth.cancel();
    state.status = "idle";
    state.idx = 0;
    state.pendingAuto = false;
    state.paras.forEach(function (p) { p.classList.remove("tts-on"); });
    app.classList.remove("tts-reading");
    render(message);
  }
  function nextChapterLink() {
    var links = app.querySelectorAll(".pager a");
    for (var i = 0; i < links.length; i++) if (links[i].textContent === "下一章") return links[i];
    return null;
  }
  function finish() {
    var next = settings.auto ? nextChapterLink() : null;
    if (next) {
      state.pendingAuto = true; // 換頁後由 onRoute 接著唸
      location.hash = next.getAttribute("href");
    } else {
      stop(settings.auto ? "這是目前最新的一章。" : "這一章唸完了。");
    }
  }

  // ---------- 介面 ----------
  function render(message) {
    var total = state.chunks.length, n = Math.min(state.idx + 1, total);
    var text = state.status === "playing" ? "朗讀中 " + n + "／" + total
      : state.status === "paused" ? "已暫停 " + n + "／" + total
      : (message || "");
    if (ui.play) {
      ui.play.textContent = state.status === "playing" ? "❚❚ 暫停" : (state.status === "paused" ? "▶ 繼續" : "🔊 中文朗讀");
      ui.play.setAttribute("aria-label", state.status === "playing" ? "暫停朗讀" : "開始朗讀");
      ui.stop.disabled = state.status === "idle";
      ui.status.textContent = text;
    }
    if (ui.mini) {
      ui.mini.hidden = state.status === "idle";
      ui.miniText.textContent = text;
      ui.miniPlay.textContent = state.status === "playing" ? "❚❚" : "▶";
      ui.miniPlay.setAttribute("aria-label", state.status === "playing" ? "暫停朗讀" : "繼續朗讀");
    }
  }
  function toggle() { if (state.status === "playing") pause(); else play(); }

  function fillVoices() {
    if (!ui.voiceSel) return;
    var sel = ui.voiceSel, list = sortedVoices();
    sel.textContent = "";
    sel.appendChild(h("option", { value: "", text: list.length ? "自動（中文）" : "裝置預設" }));
    list.forEach(function (v) {
      var natural = /natural|online|neural/i.test(v.name) ? "・自然" : "";
      sel.appendChild(h("option", { value: v.name, text: v.name.replace(/^Microsoft\s+/, "").replace(/\s*-\s*Chinese.*$/i, "") + "（" + langOf(v) + natural + "）" }));
    });
    sel.value = list.some(function (v) { return v.name === settings.voice; }) ? settings.voice : "";
  }

  function mountBar(head, prose) {
    if (!supported) {
      head.appendChild(h("p", { class: "tts-hint", text: "這個瀏覽器不支援語音朗讀，建議改用 Chrome、Edge 或 Safari。" }));
      return;
    }
    ui.play = h("button", { type: "button" });
    ui.stop = h("button", { type: "button", class: "ghost", text: "■ 停止", "aria-label": "停止朗讀" });
    ui.status = h("span", { class: "tts-status", role: "status", "aria-live": "polite" });
    var rateSel = h("select", { "aria-label": "語速" }, [0.8, 1, 1.2, 1.4].map(function (r) {
      return h("option", { value: String(r), text: r + "×" });
    }));
    rateSel.value = String(settings.rate);
    ui.voiceSel = h("select", { "aria-label": "聲音" });
    fillVoices();
    var auto = h("input", { type: "checkbox" });
    auto.checked = settings.auto;

    ui.play.addEventListener("click", toggle);
    ui.stop.addEventListener("click", function () { stop(); });
    rateSel.addEventListener("change", function () {
      settings.rate = parseFloat(rateSel.value) || 1;
      save(KEY.rate, String(settings.rate));
      if (state.status === "playing") play(state.idx); // 從目前這一小段用新語速重唸
    });
    ui.voiceSel.addEventListener("change", function () {
      settings.voice = ui.voiceSel.value;
      save(KEY.voice, settings.voice);
      if (state.status === "playing") play(state.idx);
    });
    auto.addEventListener("change", function () {
      settings.auto = auto.checked;
      save(KEY.auto, auto.checked ? "1" : "0");
    });

    ui.bar = h("div", { class: "tts-bar" }, [
      ui.play, ui.stop, ui.status,
      h("label", null, ["語速", rateSel]),
      h("label", null, ["聲音", ui.voiceSel]),
      h("label", null, [auto, "讀完自動下一章"]),
      h("p", { class: "tts-hint", text: "用你裝置內建的語音，免費。電腦建議用 Edge 瀏覽器，選標「自然」的聲音最像真人；手機請保持螢幕開著，鎖屏可能會停。朗讀時點任何一段，就從那段開始。" })
    ]);
    head.appendChild(ui.bar);

    // 朗讀中（或暫停中）點段落：從那一段開始
    prose.addEventListener("click", function (e) {
      if (state.status === "idle") return;
      var p = e.target.closest ? e.target.closest("p") : null;
      var pi = p ? state.paras.indexOf(p) : -1;
      if (pi < 0) return;
      for (var i = 0; i < state.chunks.length; i++) if (state.chunks[i].p === pi) { play(i); return; }
    });
    render();
  }

  function mountMini() {
    if (!supported || ui.mini) return;
    ui.miniText = h("span");
    ui.miniPlay = h("button", { type: "button" });
    var miniStop = h("button", { type: "button", text: "■", "aria-label": "停止朗讀" });
    ui.miniPlay.addEventListener("click", toggle);
    miniStop.addEventListener("click", function () { stop(); });
    ui.mini = h("div", { class: "tts-mini", hidden: true }, [h("span", { text: "🔊" }), ui.miniText, ui.miniPlay, miniStop]);
    document.body.appendChild(ui.mini);
  }

  // ---------- 跟著原稿換頁 ----------
  function onRoute() {
    var head = app.querySelector(".chapter-head"), prose = app.querySelector(".prose");
    var route = location.hash || "#/";
    if (!head || !prose) { // 離開章節頁（目錄、人物、改名…）就停止
      if (state.status !== "idle") stop();
      state.route = route;
      return;
    }
    if (route !== state.route) {
      if (!state.pendingAuto && state.status !== "idle") stop();
      state.route = route;
      state.chunks = [];
      state.idx = 0;
    }
    if (!head.querySelector(".tts-bar") && !head.querySelector(".tts-hint")) mountBar(head, prose);
    if (state.pendingAuto) {
      state.pendingAuto = false;
      window.setTimeout(function () { play(0); }, 400);
    }
  }

  mountMini();
  if (supported) {
    if (typeof synth.addEventListener === "function") synth.addEventListener("voiceschanged", fillVoices);
    else synth.onvoiceschanged = fillVoices;
    window.addEventListener("pagehide", function () { synth.cancel(); }); // 關掉頁面時不要繼續唸
  }
  new MutationObserver(onRoute).observe(app, { childList: true });
  onRoute(); // 直接打開某一章的網址時，原稿已經畫好了
})();
</script>
<script src="novel-tts.js"></script>
</body>
</html>
