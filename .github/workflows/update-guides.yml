name: 更新攻略資料

# 每週一台灣時間 08:00（UTC 週一 00:00）自動跑；也可在 Actions 頁面手動觸發
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install -r scraper/requirements.txt

      - name: 執行資料管線代理人
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 翻譯安全網（Cloud Translation API），跟 GEMINI_API_KEY 是不同服務、
          # 不同金鑰，缺這個 Secret 只會讓翻譯安全網跳過，不影響其他步驟。
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          # 不緩衝 stdout，讓 log 的時間戳反映真實執行時間，方便之後排查
          # （今晚除錯時發現緩衝會讓所有 [AI] 訊息擠在同一秒，誤判成「沒延遲」）。
          PYTHONUNBUFFERED: "1"
        working-directory: scraper
        run: python main.py --pages 5 --out ../guides.json

      - name: 提交更新後的 guides.json
        run: |
          git config user.name "guide-bot"
          git config user.email "bot@users.noreply.github.com"
          git add guides.json
          if git diff --staged --quiet; then
            echo "資料無變動，跳過提交"
          else
            git commit -m "chore: 自動更新攻略資料 $(date +%F)"
            # 這個管線常常跑 20-30 分鐘，跑的期間如果 master 有別的 commit
            # 進來，直接 push 會被拒絕。用 pull --rebase 重放後再推一次，
            # 失敗才真的算失敗（不是靜默放棄資料）。
            if ! git push; then
              git pull --rebase origin master
              git push
            fi
          fi
